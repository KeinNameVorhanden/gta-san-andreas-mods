name: Release

# Builds and tests SACore and attaches the install package to a GitHub release when a version tag (vX.Y.Z) is
# pushed. A manual run builds, tests and packages without publishing. It never runs on ordinary pushes, stores no
# artifacts and uses no cache; standard GitHub-hosted runners are free for public repositories.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "VERSION is $version but the tag is ${{ github.ref_name }}"
            exit 1
          }

      - name: Build
        run: |
          cmake --preset x86
          cmake --build --preset x86-release

      - name: Unit tests
        run: ctest --test-dir build/x86 -C Release --output-on-failure

      - name: Tool tests
        run: python -m unittest discover -s tests/tools

      - name: Third-party components (SHA-256 checked)
        run: python tools/fetch_components.py

      - name: Package
        run: python tools/package_release.py

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "${{ github.ref_name }}" "dist/SACore-$version.zip" `
            --title "SACore $version" --notes-file .github/release-notes.md
