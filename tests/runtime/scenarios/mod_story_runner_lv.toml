# Story runner, one chunk of the whole story: Las Venturas: Woozie's office and Caligula's (interiors 10 and 1), the heist strand with Millie's keycard.
# Starts from the save in slot3 (made by the previous chunk), stops next to the marker of 'A Home In The Hills' and saves that point into slot2 for the
# next chunk. Phone calls are answered by the runner. Fails at once when the runner stops early.
name = "mod_story_runner_lv"
tier = "full"  # long: run with --tier full (story runner changes, releases)
chain = "story"  # each chunk starts from the save the one before made: one copy, in order
chain_order = 5
timeout_seconds = 3900

[mod_config.mission_pass]
load_story_saves = false  # play every mission (the chunk also writes the story saves on the way)

[[step]]
action = "wait_state"
value = 9
timeout = 60

[[step]]
action = "load_save"
name = "slot3"

[[step]]
action = "wait_seconds"
value = 15

[[step]]
action = "wait_state"
value = 9
timeout = 90

[[step]]
action = "wait_seconds"
value = 3

[[step]]
action = "set_setting"
name = "mission_pass"
id = "save_to"
contains = "slot2"

[[step]]
action = "set_setting"
name = "mission_pass"
id = "run_to"
contains = "A Home In The Hills"

[[step]]
action = "expect_log"
contains = "mission_pass: Ready for A Home In The Hills: saved to slot2."
fail_contains = "mission_pass: Story runner stopped"
timeout = 3600

[[step]]
action = "expect_save_valid"
name = "slot2"

[[step]]
action = "set_setting"
name = "mission_pass"
id = "save_to"
contains = "off"

[[step]]
action = "quit"
