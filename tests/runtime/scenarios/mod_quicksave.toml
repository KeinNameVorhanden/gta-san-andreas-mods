# Quick save mod: keys bound, and no quick save during the opening mission chain of a new game (a save made
# during a mission reloads broken or crashes while loading). The save and load path
# itself is covered by quick_load; the full F5/F9 path in free roam follows once missions can be passed in tests.
name = "mod_quicksave"
timeout_seconds = 180

[[step]]
action = "wait_state"
value = 9
timeout = 60

[[step]]
action = "expect_log"
contains = "quicksave: ready: quick save F5, quick load F9 (press twice)"
timeout = 5

[[step]]
action = "wait_player"
field = "mission"
min = 1
max = 1
timeout = 30

[[step]]
action = "press_key"
value = 116

[[step]]
action = "expect_log"
contains = "quicksave: Quick save is not possible"
timeout = 5

[[step]]
action = "quit"
