# Story saves, a game past the target: from the save at the end of the story (slot1, made by
# mod_story_runner_finale) run_to Badlands cannot be played any more; the runner loads Badlands' story save.
name = "mod_story_saves_past"
tier = "full"  # long: run with --tier full (story runner changes, releases)
chain = "story"  # each chunk starts from the save the one before made: one copy, in order
chain_order = 9
timeout_seconds = 300

[[step]]
action = "wait_state"
value = 9
timeout = 60

[[step]]
action = "load_save"
name = "slot1"

[[step]]
action = "wait_seconds"
value = 15

[[step]]
action = "wait_state"
value = 9
timeout = 90

[[step]]
action = "wait_seconds"
value = 3

[[step]]
action = "set_setting"
name = "mission_pass"
id = "run_to"
contains = "Badlands"

[[step]]
action = "expect_log"
contains = "(this game is past it)"
fail_contains = "mission_pass: Story runner stopped"
timeout = 10

[[step]]
action = "expect_log"
contains = "mission_pass: Ready for Badlands: story save loaded."
fail_contains = "mission_pass: Story runner stopped"
timeout = 120

[[step]]
action = "quit"
