# Quick save mod, success path in free roam: the mission pass route (mod_mission_pass) brings a new game to free
# roam after "Big Smoke"; F5 then quick saves (money 4321), the money is changed, F9 twice loads the quick save and
# the money is 4321 again.
name = "mod_quicksave_freeroam"

timeout_seconds = 330

[mod_config.cutscene_skip]
auto_skip = true

[[step]]
action = "expect_log"
contains = "mission_pass: ready: pass key F6 (press twice)"
timeout = 30

[[step]]
action = "wait_state"
value = 9
timeout = 60

[[step]]
action = "expect_log"
contains = "mission_pass: mission started: 2 'In the Beginning'"
timeout = 30

[[step]]
action = "press_key"
value = 117

[[step]]
action = "wait_seconds"
value = 0.4

[[step]]
action = "press_key"
value = 117

[[step]]
action = "expect_log"
contains = "mission_pass: mission 'In the Beginning' ended without MISSION PASSED via pass code"
timeout = 20

# The Big Smoke marker in Grove Street (globals $459..$461 from INITIAL), on foot.

[[step]]
action = "wait_seconds"
value = 1

[[step]]
action = "teleport"
x = 2495.214
y = -1687.03
z = 12.514

[[step]]
action = "expect_log"
contains = "mission_pass: mission started: 11 'Big Smoke'"
timeout = 30

[[step]]
action = "press_key"
value = 117

[[step]]
action = "wait_seconds"
value = 0.4

[[step]]
action = "press_key"
value = 117

[[step]]
action = "expect_log"
contains = "mission_pass: mission passed: 'Big Smoke'"
timeout = 45

[[step]]
action = "wait_player"
field = "mission"
min = 0
max = 0
timeout = 30

[[step]]
action = "wait_seconds"
value = 3

[[step]]
action = "set_money"
value = 4321

[[step]]
action = "wait_player"
field = "money"
min = 4321
max = 4321
timeout = 5

[[step]]
action = "press_key"
value = 116

[[step]]
action = "expect_log"
contains = "quicksave: Quick saved ("
timeout = 20

[[step]]
action = "set_money"
value = 1

[[step]]
action = "press_key"
value = 120

[[step]]
action = "wait_seconds"
value = 0.4

[[step]]
action = "press_key"
value = 120

[[step]]
action = "expect_log"
contains = "saves: loading quick"
timeout = 5

[[step]]
action = "wait_player"
field = "money"
min = 4321
max = 4321
timeout = 120

[[step]]
action = "expect_frames_advance"
value = 2
min = 20

[[step]]
action = "quit"
