id = "controller"
name = "XInput controller"
version = "1.0.0"
author = "SACore"
description = "Xbox-style controllers on the 1.0 US build (the Steam build supports them itself)"
api_version = 1
min_core_version = "1.2.0"
dll = "controller.dll"

[config.enabled]
default = true
description = "Read an XInput controller (1.0 US only)"

[config.controller]
default = 0
min = 0
max = 3
description = "Controller number (0 = first)"

[config.deadzone]
default = 0.2
min = 0.0
max = 0.6
description = "Stick dead zone (fraction of the full range)"
