id = "radar"
name = "Radar zoom and GPS"
version = "1.0.0"
author = "SACore"
description = "Zoom the radar and draw the road route to the map waypoint"
api_version = 1
min_core_version = "1.2.0"
dll = "radar.dll"

[config.enabled]
default = true
description = "Radar zoom and GPS active"

[config.zoom]
default = 1.0
min = 0.5
max = 2.0
description = "Radar zoom (above 1 shows more of the map, below 1 less)"

[config.zoom_key]
default = 0
min = 0
max = 254
description = "Windows key code that cycles the zoom 1, 1.5, 2, 0.75 (0 = no key)"

[config.gps]
default = true
description = "Draw the road route to the waypoint you set on the map"

[config.gps_width]
default = 3.0
min = 1.0
max = 8.0
description = "GPS line width in pixels (at 720 lines; scales with the resolution)"
